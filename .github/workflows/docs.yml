name: docs

# Versioned docs via ``mike``.
#
#   - ``v<x.y.z.w>`` tag push → ``mike deploy <x.y.z.w> latest
#     --push --update-aliases``.  The new release becomes the
#     default version served at the site root.
#   - master push                  → ``mike deploy master --push``.
#     Bleeding-edge view, available at ``/master/`` but not the
#     site-root default.
#   - pull request                 → strict ``mkdocs build`` only,
#     no deploy.
#   - workflow_dispatch with no inputs → re-runs the deploy logic
#     for the ref it was dispatched on (recovery from a failed
#     auto-run).
#   - workflow_dispatch with ``version`` + ``source_ref`` →
#     RETROACTIVE deploy.  Checks out ``source_ref`` for the docs
#     content, deploys as ``<version>``, does NOT move ``latest``
#     or default.  Use this to backfill older releases without
#     clobbering the current site.
#
# Mike pushes to the ``gh-pages`` branch; Pages must be configured
# to serve from that branch (Settings → Pages → Branch: gh-pages,
# Folder: /).

on:
  push:
    branches: [master]
    tags: ['v*']
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - '.github/workflows/docs.yml'
  workflow_dispatch:
    inputs:
      version:
        description: "Retroactive deploy: version to publish (e.g. 6.0.25.23). Empty = normal ref-based behaviour."
        required: false
        default: ""
      source_ref:
        description: "Retroactive deploy: git ref to source docs from (commit SHA, branch, or tag). Empty = github.ref."
        required: false
        default: ""

permissions:
  contents: write   # mike needs to push to gh-pages

# Rapid-fire commits (e.g. the per-page docs rewrite stream)
# would otherwise queue up N Pages deploys racing each other.
# Cancel any in-flight run on the same ref when a new commit
# lands — only the latest state ships, and CI minutes don't get
# burned on intermediate deploys we'd never see.  PRs get their
# own group so a PR push doesn't cancel the master deploy.
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: self-hosted
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.source_ref || github.ref }}

      - name: Install venv prerequisite
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends python3-venv

      - name: Install MkDocs Material + mike
        # Use a per-job venv to dodge PEP 668 ("externally managed
        # environment") on the host system Python.  Ubuntu 23.04+
        # refuses ``pip install`` against system Python; a venv
        # sidesteps that without --break-system-packages.
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --upgrade pip
          "$RUNNER_TEMP/venv/bin/pip" install mkdocs mkdocs-material mike
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"

      # --strict turns warnings (dead links, missing nav targets,
      # broken anchors) into hard failures so the docs PR red-flags
      # rot before it lands.  Build verification only; mike does
      # the deploy in the dedicated deploy step below.
      - name: Build docs (strict)
        run: mkdocs build --strict

  # Boot a real linbpq with every fenced ``ini`` block under
  # docs/**/*.md and assert the parser accepts it cleanly.  Catches
  # the case where a doc references a keyword the parser has
  # renamed / removed / repurposed upstream.
  cfg-snippets:
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.source_ref || github.ref }}

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            libpaho-mqtt-dev \
            libjansson-dev \
            libminiupnpc-dev \
            libconfig-dev \
            libpcap-dev \
            zlib1g-dev \
            python3-venv

      - name: Build linbpq
        run: |
          make -j"$(nproc)"
          test -x linbpq

      - name: Install pytest
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --upgrade pip
          "$RUNNER_TEMP/venv/bin/pip" install pytest pytest-xdist
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"

      - name: Run doc cfg-snippet boot check
        env:
          LINBPQ_BIN: ${{ github.workspace }}/linbpq
        run: |
          cd tests/integration
          python -m pytest test_doc_cfg_snippets.py -n auto

  deploy:
    # Publish via ``mike`` on:
    #   - master push           → ``master/`` snapshot.
    #   - ``v*`` tag push       → ``<version>/`` snapshot + ``latest``
    #                             alias + site-root default.
    #   - workflow_dispatch     → same logic based on the ref the
    #                             dispatch was invoked on, so a
    #                             failed deploy can be re-driven
    #                             from the Actions tab without
    #                             needing to re-tag.
    # PR builds verify the site builds + cfg snippets parse; they
    # don't push.  Don't deploy if the cfg-snippets check failed.
    if: >-
      (github.event_name == 'push' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))) ||
      (github.event_name == 'workflow_dispatch' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v') || inputs.version != ''))
    needs: [build, cfg-snippets]
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v6
        with:
          # mike needs the full history to compute version diffs.
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.source_ref || github.ref }}

      - name: Install venv prerequisite
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends python3-venv

      - name: Install MkDocs Material + mike
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --upgrade pip
          "$RUNNER_TEMP/venv/bin/pip" install mkdocs mkdocs-material mike
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"

      - name: Configure git for mike
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Deploy versioned docs
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ -n "${INPUT_VERSION:-}" ]]; then
            # Retroactive deploy.  Publish under the explicit
            # version name; do NOT update aliases (latest stays
            # where it is) or set-default.
            mike deploy --push "${INPUT_VERSION}"
          elif [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            # Strip the leading ``v`` to get the BPQ version string.
            VERSION="${GITHUB_REF#refs/tags/v}"
            mike deploy --push --update-aliases "${VERSION}" latest
            mike set-default --push latest
          else
            # master push → publish to ``master/`` slot, no alias move.
            mike deploy --push master
          fi
