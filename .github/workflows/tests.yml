name: tests

on:
  push:
    branches: [master]
    # Run on any code/test change.  The ignore list catches the things
    # that demonstrably can't break the suite: pure docs / planning /
    # markdown, the docs workflow + mkdocs config, the docker-publish
    # workflow, and the runtime-image artefacts (the test image is
    # docker/Dockerfile.test, not docker/Dockerfile).
    paths-ignore:
      - 'docs/**'
      - 'notes/**'
      - '**.md'
      - 'mkdocs.yml'
      - '.github/workflows/docs.yml'
      - '.github/workflows/docker-publish.yml'
      - 'docker/Dockerfile'
      - 'docker/entrypoint.sh'
      - 'docker/bpq32.cfg.example'
  pull_request:
    branches: [master]
    paths-ignore:
      - 'docs/**'
      - 'notes/**'
      - '**.md'
      - 'mkdocs.yml'
      - '.github/workflows/docs.yml'
      - '.github/workflows/docker-publish.yml'
      - 'docker/Dockerfile'
      - 'docker/entrypoint.sh'
      - 'docker/bpq32.cfg.example'
  workflow_dispatch:

# Cancel an in-flight run on the same ref when a new commit lands.
# Avoids stacking up CI minutes when a stream of commits hits
# (e.g. a docs rewrite firing per-page commits).  PR runs get
# their own group so they don't cancel master pushes and vice
# versa.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Integration suite — split into two parallel jobs by the
  # ``long_runtime`` marker.  The "fast" job runs everything except
  # long_runtime in ~10-12 min; the "long" job runs only
  # long_runtime tests (beacons, soak/leak — 2-3 min each, 6 of
  # them, ~10-15 min wallclock).  Splitting halves wallclock vs
  # the merged single-job arrangement and keeps each job under a
  # comfortable timeout.
  #
  # Both jobs share the same Docker image (built once, then each
  # job runs its slice).
  integration-fast:
    name: integration (fast)
    runs-on: self-hosted
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker buildx
        uses: docker/setup-buildx-action@v4

      - name: Build test image (with layer cache)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile.test
          tags: linbpq-test:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run integration suite (not long_runtime)
        run: |
          mkdir -p reports
          docker run --rm \
            -v "$PWD/reports:/reports" \
            linbpq-test:ci \
            python3 -m pytest -n auto -m "not long_runtime" \
              --junitxml=/reports/junit-integration-fast.xml

      - name: Upload junit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: junit-integration-fast
          path: reports/junit-integration-fast.xml
          if-no-files-found: warn

      - name: Publish test summary
        if: always()
        uses: mikepenz/action-junit-report@v6
        with:
          report_paths: reports/junit-integration-fast.xml
          check_name: integration (fast)
          fail_on_failure: false

  integration-long:
    name: integration (long_runtime)
    runs-on: self-hosted
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker buildx
        uses: docker/setup-buildx-action@v4

      - name: Build test image (with layer cache)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile.test
          tags: linbpq-test:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run long_runtime integration tests
        run: |
          mkdir -p reports
          docker run --rm \
            -v "$PWD/reports:/reports" \
            linbpq-test:ci \
            python3 -m pytest -n auto -m long_runtime \
              --junitxml=/reports/junit-integration-long.xml

      - name: Upload junit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: junit-integration-long
          path: reports/junit-integration-long.xml
          if-no-files-found: warn

      - name: Publish test summary
        if: always()
        uses: mikepenz/action-junit-report@v6
        with:
          report_paths: reports/junit-integration-long.xml
          check_name: integration (long_runtime)
          fail_on_failure: false

  # Playwright suite — runs inside Microsoft's official Playwright
  # Python container.  Earlier this ran natively on the self-hosted
  # runner, but when the runner host moved to Ubuntu 26.04 Playwright
  # 1.60.0 stopped supporting it ("Playwright does not support
  # chromium on ubuntu26.04-x64").  The MCR image pins the distro to
  # noble (24.04) regardless of host OS and ships Chromium + Python +
  # Playwright pre-installed, so the host's OS no longer matters.
  playwright:
    runs-on: self-hosted
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker buildx
        uses: docker/setup-buildx-action@v4

      - name: Build playwright test image (with layer cache)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile.playwright
          tags: linbpq-playwright:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run playwright suite
        run: |
          mkdir -p reports
          docker run --rm \
            -v "$PWD/reports:/reports" \
            linbpq-playwright:ci \
            python3 -m pytest -n auto \
              --junitxml=/reports/junit-playwright.xml

      - name: Upload playwright junit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: junit-playwright
          path: reports/junit-playwright.xml
          if-no-files-found: warn

      - name: Publish playwright summary
        if: always()
        uses: mikepenz/action-junit-report@v6
        with:
          report_paths: reports/junit-playwright.xml
          check_name: playwright
          fail_on_failure: false
