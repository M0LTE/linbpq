name: docker-publish

# Builds the runtime linbpq Docker image and pushes it to Docker Hub.
#
# Tagging scheme (decided in #49):
#   - The image tag tracks the upstream BPQ version.  A release is
#     a ``v<x.y.z.w>`` git tag whose value equals the
#     ``KVerstring`` in ``Versions.h`` — e.g. ``v6.0.25.28``.
#   - On ``v*`` tag push:  publish ``<x.y.z.w>`` AND move ``latest``.
#   - On master push:      publish ``master-<short-sha>`` only.
#                          ``latest`` is *not* moved by master pushes;
#                          users who want the absolute fork tip pull
#                          ``master-<sha>``.
#   - On manual dispatch:  publish the branch name.
#   - On workflow_dispatch with ``version`` + ``source_ref``:
#     RETROACTIVE build.  Checks out ``source_ref`` for source,
#     publishes only the explicit ``<version>`` tag.  Does NOT
#     move ``latest``.  Use this to backfill older releases.
#
# Secrets required:
#   - ``DOCKERHUB_USERNAME`` — Docker Hub user / org owning the image.
#   - ``DOCKERHUB_TOKEN``    — Docker Hub access token.

on:
  push:
    branches: [master]
    tags: ['v*']
    # Only rebuild when something that ends up in the runtime image
    # actually changes.  Use ``workflow_dispatch`` to force a rebuild
    # without a relevant change (e.g. base-image security rebuilds).
    paths:
      - '*.c'
      - '*.h'
      - 'makefile'
      - 'HTML/**'
      - 'docker/Dockerfile'
      - 'docker/entrypoint.sh'
      - 'docker/bpq32.cfg.example'
      - '.github/workflows/docker-publish.yml'
  workflow_dispatch:
    inputs:
      version:
        description: "Retroactive build: image tag to publish (e.g. 6.0.25.23). Empty = normal ref-based behaviour."
        required: false
        default: ""
      source_ref:
        description: "Retroactive build: git ref to source from (commit SHA, branch, or tag). Empty = github.ref."
        required: false
        default: ""

concurrency:
  group: docker-publish-${{ github.ref }}
  # Cancel superseded in-progress builds on branch pushes (master,
  # patched, etc) — there's no point finishing a build for an older
  # SHA when a newer push is right behind it.  Keep tag-ref builds
  # (``v*``, ``v*-patched*``) un-cancellable: those publish manifest
  # lists for a release and getting interrupted mid-push would leave
  # a half-baked release tag on Docker Hub.
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  publish:
    runs-on: self-hosted
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6
        with:
          # Defensive: only read inputs.source_ref when actually on
          # workflow_dispatch.  On push events ``inputs.X`` is
          # undefined and GHA coerces ``null != ''`` to true (via
          # 0 → NaN), so naked ``inputs.X || fallback`` is not safe.
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.source_ref || github.ref }}

      - name: Set up Docker buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/linbpq
          # Disable auto-`latest`.  metadata-action's default
          # ``flavor: latest=auto`` adds ``latest`` for any semver tag,
          # which would clobber the upstream-clean ``latest`` when a
          # ``v*-patched*`` tag is pushed.  We control ``latest``
          # explicitly via the ``type=raw,value=latest,...`` rule below.
          flavor: |
            latest=false
          tags: |
            # Retroactive build: only fires on workflow_dispatch
            # with a non-empty ``version`` input.  Publishes just
            # that explicit tag — ``latest`` is not moved.
            type=raw,value=${{ inputs.version }},enable=${{ github.event_name == 'workflow_dispatch' && inputs.version != '' }}
            # ``v6.0.25.28`` tag push → ``6.0.25.28`` + ``latest``.
            # Strictly push-event only.
            type=match,pattern=v(.*),group=1,enable=${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=latest,enable=${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
            # master push → ``master-<sha>`` only.  Also fires for a
            # workflow_dispatch from master with no retroactive
            # version (manual rebuild).
            type=sha,prefix=master-,enable=${{ github.ref == 'refs/heads/master' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.version == '')) }}
            # workflow_dispatch on a non-master branch with no
            # retroactive version → branch name.
            type=ref,event=branch,enable=${{ github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/master' && inputs.version == '' }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
