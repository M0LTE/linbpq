name: docker-publish

# Builds the runtime linbpq Docker image and pushes it to Docker Hub.
#
# Tagging scheme (decided in #49):
#   - The image tag tracks the upstream BPQ version.  A release is
#     a ``v<x.y.z.w>`` git tag whose value equals the
#     ``KVerstring`` in ``Versions.h`` — e.g. ``v6.0.25.28``.
#   - On ``v*`` tag push:  publish ``<x.y.z.w>`` AND move ``latest``.
#   - On master push:      publish ``master-<short-sha>`` only.
#                          ``latest`` is *not* moved by master pushes;
#                          users who want the absolute fork tip pull
#                          ``master-<sha>``.
#   - On manual dispatch:  publish the branch name.
#
# Secrets required:
#   - ``DOCKERHUB_USERNAME`` — Docker Hub user / org owning the image.
#   - ``DOCKERHUB_TOKEN``    — Docker Hub access token.

on:
  push:
    branches: [master]
    tags: ['v*']
    # Only rebuild when something that ends up in the runtime image
    # actually changes.  Use ``workflow_dispatch`` to force a rebuild
    # without a relevant change (e.g. base-image security rebuilds).
    paths:
      - '*.c'
      - '*.h'
      - 'makefile'
      - 'HTML/**'
      - 'docker/Dockerfile'
      - 'docker/entrypoint.sh'
      - 'docker/bpq32.cfg.example'
      - '.github/workflows/docker-publish.yml'
  workflow_dispatch:

concurrency:
  group: docker-publish-${{ github.ref }}
  # Don't cancel a release-tag publish mid-push — we'd end up with
  # half the manifest list.  Master pushes can cancel each other.
  cancel-in-progress: ${{ github.ref == 'refs/heads/master' }}

jobs:
  publish:
    runs-on: self-hosted
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/linbpq
          tags: |
            # ``v6.0.25.28`` tag push → ``6.0.25.28`` + ``latest``.
            # ``{{raw}}`` strips the leading ``v`` so the image tag
            # is exactly the BPQ version string.
            type=match,pattern=v(.*),group=1,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            # master push → ``master-<sha>`` only.  Does not move
            # ``latest`` — only release tags do.
            type=sha,prefix=master-,enable=${{ github.ref == 'refs/heads/master' }}
            # workflow_dispatch on any other branch → branch name.
            type=ref,event=branch,enable=${{ github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/master' }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
